# Dev/project tools. System tools and GUI apps use bootstrap packages below.
[tools]
1password = "latest"
azure = { version = "latest", uvx_args = "--python 3.13" }
claude = "latest"
codex = "latest"
copilot = "latest"
fd = "latest"
github-cli = "latest"
go = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
node = "lts"
"npm:@earendil-works/gondolin" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
opencode = "latest"
pipx = "latest"
"pipx:hf" = "latest"
"pipx:ipython" = "latest"
python = "latest"
rust = "latest"
usage = "latest"
uv = "latest"

[settings.npm]
shell_out = true

[bootstrap.packages]
# Mac App Store command-line interface
"brew:mas" = "latest"
# Distributed revision control system
"brew:git" = "latest"
# User-friendly command-line shell for UNIX-like operating systems
"brew:fish" = "latest"
# Ambitious Vim-fork focused on extensibility and agility
"brew:neovim" = "latest"
# Terminal multiplexer
"brew:tmux" = "latest"
# 7-Zip is a file archiver with a high compression ratio
"brew:sevenzip" = "latest"
# Resource monitor. C++ version and continuation of bashtop and bpytop
"brew:btop" = "latest"
# Syntax-highlighting pager for git and diff output
"brew:git-delta" = "latest"
# Manage your dotfiles across multiple diverse machines, securely
"brew:chezmoi" = "latest"
# Tools and libraries to manipulate images in select formats
"brew:imagemagick" = "latest"
# Interpreter for PostScript and PDF
"brew:ghostscript" = "latest"
# Bourne-Again SHell, a UNIX command interpreter
"brew:bash" = "latest"
# GNU compiler collection
"brew:gcc" = "latest"
# Object-file caching compiler wrapper
"brew:ccache" = "latest"
# Cross-platform make
"brew:cmake" = "latest"
# Interactive GPU process monitor
"brew:nvtop" = "latest"
# Search tool like grep and The Silver Searcher
"brew:ripgrep" = "latest"
# Generic machine emulator and virtualizer
"brew:qemu" = "latest"
# Improved shell history for zsh, bash, fish and nushell
"brew:atuin" = "latest"
# Play, record, convert, and stream select audio and video codecs
"brew:ffmpeg" = "latest"
# Change macOS audio source from the command-line
"brew:switchaudio-osx" = "latest"
# Modern Day Portscanner
"brew:rustscan" = "latest"
# Ruby 3+ lets mise read cask definitions from third-party taps
"brew:ruby" = "latest"

# Password manager that keeps all passwords secure behind one password
"brew-cask:1password" = "latest"
# Anthropic's official Claude AI desktop app
"brew-cask:claude" = "latest"
# Voice and text chat software
"brew-cask:discord" = "latest"
# Web browser
"brew-cask:firefox" = "latest"
# Terminal emulator that uses platform-native UI and GPU acceleration
"brew-cask:ghostty" = "latest"
# Meet, chat, call, and collaborate in just one place
"brew-cask:microsoft-teams" = "latest"
# Add more gestures for Trackpad and Magic Mouse
"brew-cask:multitouch" = "latest"
# Music streaming service
"brew-cask:spotify" = "latest"
# Open-source code editor
"brew-cask:visual-studio-code" = "latest"
# G-code generator for 3D printers
"brew-cask:orcaslicer" = "latest"
# Collection of apps and services for photography, design, video, web, and UX
"brew-cask:adobe-creative-cloud" = "latest"
# Companion app for Home Assistant home automation software
"brew-cask:home-assistant" = "latest"
# Databases and SQL IDE
"brew-cask:datagrip" = "latest"
# Video communication and virtual meeting platform
"brew-cask:zoom" = "latest"
# Multimedia player
"brew-cask:vlc" = "latest"
# REST, GraphQL and gRPC client
"brew-cask:yaak" = "latest"
# Video game digital distribution service
"brew-cask:steam" = "latest"
# Connect to Windows
"brew-cask:windows-app" = "latest"
# Open-source software for live streaming and screen recording
"brew-cask:obs" = "latest"
# Screenshot measurement and annotation tool
"brew-cask:shottr" = "latest"
# Minecraft launcher
"brew-cask:prismlauncher" = "latest"
# Utility improving 3rd party mouse performance and functionalities
"brew-cask:bettermouse" = "latest"
# Google Chromium, sans integration with Google
"brew-cask:ungoogled-chromium" = "latest"
# Spreadsheet software
"brew-cask:microsoft-excel" = "latest"
# Word processor
"brew-cask:microsoft-word" = "latest"
# Graphical client for Git version control
"brew-cask:sourcetree" = "latest"
# Administration tool for MikroTik RouterOS
"brew-cask:winbox" = "latest"
# Replacement for Docker Desktop
"brew-cask:orbstack" = "latest"
# Knowledge base that works on top of a local folder of plain text Markdown files
"brew-cask:obsidian" = "latest"
# Desktop application for Unsloth Studio
"brew-cask:unsloth" = "latest"
# Open-source desktop AI agent
"brew-cask:hermes-desktop" = "latest"
# Time tracker
"brew-cask:activitywatch" = "latest"
# Menu bar app for USB-C cable diagnostics
"brew-cask:darrylmorley/whatcable/whatcable" = "latest"
# Stream Deck software with support for Elgato Stream Deck plugins
"brew-cask:dsluo/tap/opendeck" = "latest"
# Label printer application
# "brew-cask:dsluo/tap/lprint" = "latest"

# Mac App Store apps
"mas:6745342698" = "latest" # uBlock Origin Lite
