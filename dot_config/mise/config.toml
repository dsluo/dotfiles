# Third-party agent skills, cloned here and symlinked into ~/.agents/skills by chezmoi.
[bootstrap.repos]
"~/.local/share/agent-skills/gh-stack" = { url = "https://github.com/github/gh-stack.git", ref = "v0.3.0", depth = 1 }
